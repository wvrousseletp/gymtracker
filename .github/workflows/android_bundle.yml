name: Build & Deploy Android (.aab)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play Track (internal, alpha, beta, production)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-and-deploy:
    name: Build & Deploy Android Release Bundle (.aab)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Permanent Production Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat <<EOF > android/key.properties
          storePassword=LosMoosclesKey2026!
          keyPassword=LosMoosclesKey2026!
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          echo "=== VERIFICANDO ASSINATURA DO KEYSTORE CARREGADO ==="
          keytool -list -v -keystore android/app/upload-keystore.jks -storepass LosMoosclesKey2026! || true

      - name: Build App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Upload Android App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Deploy to Google Play Console
        if: env.HAVE_PLAY_KEY == 'true'
        env:
          HAVE_PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.losmooscles
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
