name: Build & Deploy Android (.aab)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play Track (internal, alpha, beta, production)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-and-deploy:
    name: Build & Deploy Android Release Bundle (.aab)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Fixed Production Upload Keystore
        run: |
          mkdir -p android/app
          rm -f android/app/upload-keystore.jks

          # Generate fixed permanent upload keystore
          keytool -genkey -v -keystore android/app/upload-keystore.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias upload -dname "CN=LosMooscles, OU=Mobile, O=LosMooscles, L=SaoPaulo, ST=SP, C=BR" -storepass LosMoosclesKey2026! -keypass LosMoosclesKey2026! -noprompt

          # Export public PEM certificate for Google Play Support Upload Key Reset
          keytool -export -rfc -alias upload -file android/app/upload_certificate.pem -keystore android/app/upload-keystore.jks -storepass LosMoosclesKey2026!

          cat <<EOF > android/key.properties
          storePassword=LosMoosclesKey2026!
          keyPassword=LosMoosclesKey2026!
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Upload Android App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Certificate PEM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload_certificate.pem
          path: android/app/upload_certificate.pem

      - name: Deploy to Google Play Console
        if: env.HAVE_PLAY_KEY == 'true'
        env:
          HAVE_PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.losmooscles
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
