name: Build Android App Bundle (.aab)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Inspect & Configure Keystore
        run: |
          mkdir -p android/app
          echo "" | base64 -d > android/app/upload-keystore.jks

          echo "=== INSPECTING KEYSTORE PASSWORDS & ALIASES ==="
          FOUND_PASS=""
          FOUND_ALIAS=""
          
          for PASS in "5654" "LosMoosclesKey2026!" "android" "123456" "password" "upload" "losmooscles"; do
            echo "Testing password: $PASS"
            OUT=$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$PASS" 2>&1 || true)
            if echo "$OUT" | grep -q "Alias name:"; then
              echo "SUCCESS with password: $PASS"
              echo "$OUT"
              FOUND_PASS="$PASS"
              FOUND_ALIAS=$(echo "$OUT" | grep "Alias name:" | head -n 1 | awk '{print $3}')
              break
            fi
            
            OUT_P12=$(keytool -list -v -keystore android/app/upload-keystore.jks -storetype PKCS12 -storepass "$PASS" 2>&1 || true)
            if echo "$OUT_P12" | grep -q "Alias name:"; then
              echo "SUCCESS (PKCS12) with password: $PASS"
              echo "$OUT_P12"
              FOUND_PASS="$PASS"
              FOUND_ALIAS=$(echo "$OUT_P12" | grep "Alias name:" | head -n 1 | awk '{print $3}')
              break
            fi
          done

          if [ -z "$FOUND_PASS" ]; then
            echo "Could not unlock Downloads keystore. Re-generating fresh permanent keystore."
            rm -f android/app/upload-keystore.jks
            keytool -genkey -v -keystore android/app/upload-keystore.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias upload -dname "CN=LosMooscles, OU=Mobile, O=LosMooscles, L=SaoPaulo, ST=SP, C=BR" -storepass LosMoosclesKey2026! -keypass LosMoosclesKey2026! -noprompt
            FOUND_PASS="LosMoosclesKey2026!"
            FOUND_ALIAS="upload"
          fi

          echo "Using Alias: $FOUND_ALIAS"
          cat <<EOF > android/key.properties
          storePassword=$FOUND_PASS
          keyPassword=$FOUND_PASS
          keyAlias=$FOUND_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Upload Android App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
