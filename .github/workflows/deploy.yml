name: Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to TestFlight
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version and Installed Xcodes
        run: |
          xcodebuild -version
          ls -d /Applications/Xcode* || true

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profiles
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          WATCH_PROFILE_BASE64: ${{ secrets.IOS_WATCH_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Check if secrets are set
          if [ -z "$IOS_PROFILE_BASE64" ]; then
            echo "::error::Secret IOS_PROVISIONING_PROFILE_BASE64 is empty or not configured!"
            exit 1
          fi
          if [ -z "$WATCH_PROFILE_BASE64" ]; then
            echo "::error::Secret IOS_WATCH_PROVISIONING_PROFILE_BASE64 is empty or not configured!"
            exit 1
          fi
          if [ -z "$WIDGET_PROFILE_BASE64" ]; then
            echo "::error::Secret IOS_WIDGET_PROVISIONING_PROFILE_BASE64 is empty or not configured!"
            exit 1
          fi
          
          # Decode and install iOS Profile
          echo -n "$IOS_PROFILE_BASE64" | base64 --decode --output ios_temp.mobileprovision
          IOS_UUID=$(security cms -D -i ios_temp.mobileprovision | plutil -extract UUID raw -)
          mv ios_temp.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$IOS_UUID.mobileprovision
          echo "Installed iOS Profile with UUID: $IOS_UUID"
          
          # Decode and install Watch Profile
          echo -n "$WATCH_PROFILE_BASE64" | base64 --decode --output watch_temp.mobileprovision
          WATCH_UUID=$(security cms -D -i watch_temp.mobileprovision | plutil -extract UUID raw -)
          mv watch_temp.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$WATCH_UUID.mobileprovision
          echo "Installed Watch Profile with UUID: $WATCH_UUID"
          
          # Decode and install Widget Profile
          echo -n "$WIDGET_PROFILE_BASE64" | base64 --decode --output widget_temp.mobileprovision
          WIDGET_UUID=$(security cms -D -i widget_temp.mobileprovision | plutil -extract UUID raw -)
          mv widget_temp.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$WIDGET_UUID.mobileprovision
          echo "Installed Widget Profile with UUID: $WIDGET_UUID"


      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          echo "=== CONTEÚDO DO DIRETÓRIO build/ ==="
          find build -maxdepth 5 -type f || true
          IPA_PATH=$(find build -name "*.ipa" | head -n 1)
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV
          echo "Encontrado IPA em: $IPA_PATH"

      - name: Upload to App Store Connect (TestFlight)
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          wait-for-processing: false

