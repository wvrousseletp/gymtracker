name: Export PEM Certificate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export-pem:
    name: Export PEM Certificate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Export PEM from 5654 Keystore
        run: |
          mkdir -p android/app
          echo "" | base64 -d > android/app/upload-keystore.jks
          
          keytool -export -rfc -alias upload -file upload_certificate.pem -keystore android/app/upload-keystore.jks -storepass 5654 || keytool -export -rfc -alias key0 -file upload_certificate.pem -keystore android/app/upload-keystore.jks -storepass 5654

      - name: Upload Certificate PEM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload_certificate.pem
          path: upload_certificate.pem
